<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List</title>
    <style>
        :root {
            color: #172033;
            background: #f6f8fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f6f8fb;
        }

        main {
            width: min(720px, calc(100% - 32px));
            margin: 48px auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            letter-spacing: 0;
        }

        .summary {
            margin: 0 0 24px;
            color: #5b6475;
        }

        .add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #cdd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            height: 44px;
            border: 0;
            border-radius: 8px;
            padding: 0 16px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: #eef2f7;
            color: #172033;
        }

        button.danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .todo-list {
            display: grid;
            gap: 10px;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .todo-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 8px;
            align-items: center;
            min-height: 56px;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
        }

        .todo-title {
            overflow-wrap: anywhere;
            font-size: 16px;
        }

        .todo-title.completed {
            color: #8a94a6;
            text-decoration: line-through;
        }

        .empty {
            padding: 24px;
            border: 1px dashed #cdd5e1;
            border-radius: 8px;
            color: #5b6475;
            text-align: center;
            background: #ffffff;
        }

        .hidden {
            display: none;
        }

        .error {
            min-height: 20px;
            margin: 0 0 12px;
            color: #b91c1c;
            font-size: 14px;
        }

        @media (max-width: 540px) {
            main {
                margin: 28px auto;
            }

            .add-form {
                flex-direction: column;
            }

            .todo-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Todo List</h1>
    <p class="summary">CI/CD 도메인에서 Supabase PostgreSQL 저장을 확인하는 간단한 목록입니다.</p>

    <form class="add-form" method="post" th:action="@{/todos}">
        <input type="text" name="title" maxlength="200" placeholder="할 일을 입력하세요" required>
        <button type="submit">추가</button>
    </form>
    <p class="error" id="todo-error" aria-live="polite"></p>

    <div class="empty" id="empty-state" th:classappend="${!#lists.isEmpty(todos)} ? 'hidden'">아직 등록된 할 일이 없습니다.</div>

    <ul class="todo-list" id="todo-list">
        <li class="todo-item" th:each="todo : ${todos}" th:attr="data-id=${todo.id}">
            <span class="todo-title" th:classappend="${todo.isCompleted()} ? 'completed' : ''" th:text="${todo.title}">Todo title</span>
            <form method="post" th:action="@{/todos/{id}/toggle(id=${todo.id})}">
                <button class="secondary" type="submit" data-action="toggle" th:text="${todo.isCompleted()} ? '되돌리기' : '완료'">완료</button>
            </form>
            <form method="post" th:action="@{/todos/{id}/delete(id=${todo.id})}">
                <button class="danger" type="submit" data-action="delete">삭제</button>
            </form>
        </li>
    </ul>
</main>
<script>
    const addForm = document.querySelector(".add-form");
    const todoInput = addForm.querySelector("input[name='title']");
    const todoList = document.querySelector("#todo-list");
    const emptyState = document.querySelector("#empty-state");
    const errorMessage = document.querySelector("#todo-error");

    function setError(message) {
        errorMessage.textContent = message;
    }

    function updateEmptyState() {
        emptyState.classList.toggle("hidden", todoList.children.length > 0);
    }

    function todoItemTemplate(todo) {
        const item = document.createElement("li");
        item.className = "todo-item";
        item.dataset.id = todo.id;

        const title = document.createElement("span");
        title.className = "todo-title";
        title.textContent = todo.title;
        title.classList.toggle("completed", todo.completed);

        const toggleForm = document.createElement("form");
        toggleForm.method = "post";
        toggleForm.action = `/todos/${todo.id}/toggle`;
        const toggleButton = document.createElement("button");
        toggleButton.className = "secondary";
        toggleButton.type = "submit";
        toggleButton.dataset.action = "toggle";
        toggleButton.textContent = todo.completed ? "되돌리기" : "완료";
        toggleForm.append(toggleButton);

        const deleteForm = document.createElement("form");
        deleteForm.method = "post";
        deleteForm.action = `/todos/${todo.id}/delete`;
        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.type = "submit";
        deleteButton.dataset.action = "delete";
        deleteButton.textContent = "삭제";
        deleteForm.append(deleteButton);

        item.append(title, toggleForm, deleteForm);
        return item;
    }

    addForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setError("");

        const title = todoInput.value.trim();
        if (!title) {
            return;
        }

        const body = new URLSearchParams({title});
        const response = await fetch("/api/todos", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body
        });

        if (!response.ok) {
            setError("할 일을 추가하지 못했습니다.");
            return;
        }

        const todo = await response.json();
        todoList.prepend(todoItemTemplate(todo));
        todoInput.value = "";
        updateEmptyState();
    });

    todoList.addEventListener("submit", async (event) => {
        const button = event.submitter;
        const item = event.target.closest(".todo-item");
        if (!button || !item) {
            return;
        }

        event.preventDefault();
        setError("");

        const id = item.dataset.id;
        if (button.dataset.action === "toggle") {
            const response = await fetch(`/api/todos/${id}/toggle`, {method: "POST"});
            if (!response.ok) {
                setError("상태를 변경하지 못했습니다.");
                return;
            }

            const todo = await response.json();
            const title = item.querySelector(".todo-title");
            title.classList.toggle("completed", todo.completed);
            button.textContent = todo.completed ? "되돌리기" : "완료";
            return;
        }

        if (button.dataset.action === "delete") {
            const response = await fetch(`/api/todos/${id}`, {method: "DELETE"});
            if (!response.ok) {
                setError("할 일을 삭제하지 못했습니다.");
                return;
            }

            item.remove();
            updateEmptyState();
        }
    });

    updateEmptyState();
</script>
</body>
</html>
