services:
  api:
    image: ghcr.io/parkyc-dev/cicd-lab-api:${IMAGE_TAG:-latest}
    build: apps/api
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - app-logs:/logs/api
    restart: unless-stopped

  web:
    image: ghcr.io/parkyc-dev/cicd-lab-web:${IMAGE_TAG:-latest}
    build: apps/web
    depends_on:
      - api
    environment:
      API_ORIGIN: http://api:8080
      PORT: 3000
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:3000"
    restart: unless-stopped

volumes:
  app-logs:
