spring:
  application:
    name: parkyc-apps
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

poe-lens:
  openai:
    enabled: true
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.6-luna
    daily-limit: 100
    daily-limit-zone: Asia/Seoul
